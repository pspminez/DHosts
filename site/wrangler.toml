# Pages config for the marketing site. The SMS bot Worker's config lives at the
# repo root (wrangler.toml) — this one is read only when deploying from site/.
# Deploy (from this directory): npx wrangler pages deploy --branch main
name = "davenport-host-co"
pages_build_output_dir = "."

# Pin the runtime date. Newer defaults turn on Node compatibility, which makes
# the Pages Functions bundler pull in `unenv` polyfills that import node:stream;
# the Pages publisher rejects that module and the deploy fails. The only
# function here is the /api proxy and needs nothing from the newer default.
compatibility_date = "2024-09-23"
