name = "davenport-host-co-bot"
main = "bot/worker.ts"
compatibility_date = "2026-10-06"

[[kv_namespaces]]
binding = "PROPERTIES"
id = "5883beaefd6f4833bd480b31a117c9c3"

[[d1_databases]]
binding = "DB"
database_name = "davenport-host-co-db"
database_id = "8dd9944d-411f-408a-bb3e-c039e4f86755"

[vars]
# Signature validation is ON for production. PUBLIC_URL must exactly match
# the webhook URL configured in the Twilio console (scheme, host, path).
# Keep the current callback until api.stayxi.com is configured and Twilio is
# switched to it; change both together to avoid rejecting inbound messages.
# Guest-question insights (the Insights tab) is the paid add-on from the pilot
# plan. This is the per-deployment entitlement: set it to "false" for an
# operator who has not bought it and the tab disappears *and* the API refuses.
INSIGHTS_ENTITLED = "true"
VALIDATE_SIGNATURE = "true"
PUBLIC_URL = "https://davenport-host-co-bot.davenport-host-co-bot.workers.dev/sms"
GMAIL_OAUTH_REDIRECT_URI = "https://davenport-host-co-bot.davenport-host-co-bot.workers.dev/admin/google/oauth/callback"

[triggers]
crons = ["*/5 * * * *", "17 3 * * *"]

# Secrets must be set via: npx wrangler secret put <NAME>
# OPENROUTER_API_KEY
# TWILIO_ACCOUNT_SID
# TWILIO_AUTH_TOKEN
# ADMIN_PASSWORD
# GMAIL_CLIENT_ID
# GMAIL_CLIENT_SECRET
# GMAIL_TOKEN_ENCRYPTION_KEY
# GMAIL_FROM_EMAIL
# GMAIL_MAILING_ADDRESS